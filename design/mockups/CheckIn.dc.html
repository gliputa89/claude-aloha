<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Check-in – jak się czujesz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6E66}a:hover{color:#0A524C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; color: #16211F; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 0 20px">
    <span style="font-size: 13px; color: #5A6662">Wtorek · Interwały 45 min</span>
    <a href="Main.dc.html" aria-label="Zamknij" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; color: #16211F">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 32px; padding: 24px 20px 0; overflow: hidden">
    <section style="display: flex; flex-direction: column; gap: 20px">
      <h1 id="feel-q" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; line-height: 1.15; font-weight: 600; letter-spacing: -0.5px">Jak się dzisiaj czujesz?</h1>
      <div style="background: #FFFFFF; border: 1px solid #E3E6E0; border-radius: 24px; padding: 24px 20px 18px; display: flex; flex-direction: column; gap: 14px">
        <span aria-hidden="true" style="text-align: center; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 600; color: #0E6E66">{{feelWord}}</span>
        <input id="feel" type="range" min="1" max="5" step="1" value="{{feel}}" onChange="{{onFeel}}" aria-labelledby="feel-q" aria-valuetext="{{feelWord}}" style="width: 100%; height: 44px; margin: 0; accent-color: #0E6E66; cursor: pointer">
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #5A6662"><span>Słabo</span><span>Świetnie</span></div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <label for="note" style="font-size: 16px; font-weight: 600">Co u Ciebie? <span style="font-weight: 400; color: #5A6662">(opcjonalnie)</span></label>
      <textarea id="note" rows="3" placeholder="Napisz albo podyktuj, np. „mam tylko 20 minut”" value="{{note}}" onChange="{{onNote}}" style="font-family: inherit; font-size: 15px; line-height: 1.45; padding: 14px; border-radius: 16px; border: 1px solid #C9CFC8; background: #FFFFFF; color: #16211F; resize: none; box-sizing: border-box; min-height: 96px"></textarea>
      <div role="group" aria-label="Szybkie podpowiedzi" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
          <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.toggle}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
    </section>
  </main>

  <footer style="padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 4px">
    <a href="Proposal.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: #0E6E66; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px; border-radius: 14px; min-height: 52px">Gotowe
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; color: #5A6662; font-size: 15px; font-weight: 500; min-height: 48px">Pomiń, trenuję wg planu</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { feel: 2, note: '', tags: { time: true, sleep: true, stress: true, pain: false, energy: false } };
  }
  renderVals() {
    var self = this;
    var words = ['Słabo', 'Tak sobie', 'W porządku', 'Dobrze', 'Świetnie'];
    var base = 'font-family: inherit; font-size: 14px; font-weight: 500; min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; ';
    var on = base + 'background: #DCEFEA; color: #0B5A53; border: 1px solid #0E6E66';
    var off = base + 'background: #FFFFFF; color: #16211F; border: 1px solid #C9CFC8';
    var defs = [
      { key: 'time', label: 'Mało czasu' },
      { key: 'sleep', label: 'Mało snu' },
      { key: 'stress', label: 'Stres' },
      { key: 'pain', label: 'Coś boli' },
      { key: 'energy', label: 'Mam energię' }
    ];
    var chips = defs.map(function (d) {
      var sel = !!self.state.tags[d.key];
      return {
        label: d.label,
        pressed: sel ? 'true' : 'false',
        style: sel ? on : off,
        toggle: function () {
          var t = Object.assign({}, self.state.tags);
          t[d.key] = !sel;
          self.setState({ tags: t });
        }
      };
    });
    return {
      feel: this.state.feel,
      feelWord: words[this.state.feel - 1],
      onFeel: function (e) { self.setState({ feel: Number(e.target.value) }); },
      note: this.state.note,
      onNote: function (e) { self.setState({ note: e.target.value }); },
      chips: chips
    };
  }
}
</script>
</body>
</html>
