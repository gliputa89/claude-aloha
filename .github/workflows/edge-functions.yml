# Edge Functions (supabase/functions) – deploy na Supabase.
#
# • staging: automatycznie po pushu/merge do gałęzi `dev`, który zmienia funkcje albo plan-engine.
# • production: ręcznie – Actions → „Edge Functions” → Run workflow → production.
#
# Sekrety:
#   SUPABASE_ACCESS_TOKEN – token osobisty z panelu Supabase (Account → Access Tokens), sekret repozytorium.
#   DB_URL – w środowiskach `staging` / `production` (już jest, z `pnpm db:ci-setup`); z niego bierzemy ref projektu.

name: Edge Functions

on:
  push:
    paths:
      - supabase/functions/**
      - packages/plan-engine/**
      - scripts/sync-plan-engine.sh
      - .github/workflows/edge-functions.yml
  workflow_dispatch:
    inputs:
      target:
        description: Projekt docelowy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: edge-functions-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Skopiuj plan-engine do funkcji
        run: scripts/sync-plan-engine.sh

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Brak sekretu SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens, potem: gh secret set SUPABASE_ACCESS_TOKEN)"
            exit 1
          fi
          # Ref projektu z adresu bazy (pooler: postgres.<ref>@…)
          ref="$(printf '%s' "$DB_URL" | sed -nE 's#^[a-z]+://postgres\.([a-z0-9]+)[:@].*#\1#p')"
          if [ -z "$ref" ]; then
            echo "::error::Nie udało się odczytać ref projektu z DB_URL"
            exit 1
          fi
          supabase functions deploy --project-ref "$ref" --use-api --yes
